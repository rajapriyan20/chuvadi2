<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Restrict pinch zoom, double-tap zoom, and Ctrl/Cmd +/- or Ctrl+wheel zoom
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });

      // Prevent multi-touch pinch zoom
      document.addEventListener('touchstart', function (e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent trackpad / Ctrl+wheel zooming
      document.addEventListener('wheel', function (e) {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent Ctrl/Cmd + / - / 0 keyboard zoom shortcuts
      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
          e.preventDefault();
        }
      });

      // Prevent pull-to-refresh swipe down in installed PWA while preserving normal scrolling
      let pwaTouchStartY = 0;
      window.addEventListener('touchstart', function (e) {
        if (e.touches && e.touches.length === 1) {
          pwaTouchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      window.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length === 1) {
          const currentY = e.touches[0].clientY;
          const deltaY = currentY - pwaTouchStartY;
          // If at the top of the page and dragging downwards, prevent browser pull-to-refresh
          if ((window.scrollY <= 0 || document.documentElement.scrollTop <= 0) && deltaY > 0) {
            e.preventDefault();
          }
        }
      }, { passive: false });
    </script>
    <title>Chuvadi - A Way of Life</title>
    <meta name="description" content="Personal Life OS & ledger for managing accounts, passbooks, vehicle logs, checklists, and AI-powered expense tracking." />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="icon" type="image/svg+xml" href="./chuvadi-logo.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chuvadi" />
    <meta property="og:title" content="Chuvadi - A Way of Life" />
    <meta property="og:description" content="Personal Life OS & ledger for managing accounts, passbooks, vehicle logs, checklists, and AI-powered expense tracking." />
    <meta property="og:image" content="./chuvadi-logo.svg" />

    <meta name="twitter:card" content="summary" />

    <script src="https://accounts.google.com/gsi/client" async defer></script>
