<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Wood Gradients -->
    <linearGradient id="woodGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8be89" />
      <stop offset="35%" stop-color="#d69f62" />
      <stop offset="70%" stop-color="#b67a3e" />
      <stop offset="100%" stop-color="#8a5322" />
    </linearGradient>
    <linearGradient id="woodGrad2" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#f2cf9d" />
      <stop offset="50%" stop-color="#dfa86a" />
      <stop offset="100%" stop-color="#9a5f27" />
    </linearGradient>
    <linearGradient id="woodGrad3" x1="0%" y1="0%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#fae0b8" />
      <stop offset="40%" stop-color="#e4b377" />
      <stop offset="100%" stop-color="#a4692e" />
    </linearGradient>
    
    <!-- Antique Bronze Stylus Gradients -->
    <linearGradient id="stylusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcd0a6" />
      <stop offset="30%" stop-color="#ab9357" />
      <stop offset="70%" stop-color="#6e5726" />
      <stop offset="100%" stop-color="#3e3012" />
    </linearGradient>
    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c4" />
      <stop offset="50%" stop-color="#c9ad6a" />
      <stop offset="100%" stop-color="#6b5321" />
    </linearGradient>

    <!-- Leaf Gradients -->
    <radialGradient id="leafGrad" cx="45%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="40%" stop-color="#16a34a" />
      <stop offset="85%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Cord & Bead Gradients -->
    <linearGradient id="cordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63" />
      <stop offset="50%" stop-color="#5d4037" />
      <stop offset="100%" stop-color="#3e2723" />
    </linearGradient>

    <!-- Filters for Depth -->
    <filter id="leafShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="-4" dy="8" stdDeviation="8" flood-color="#09140c" flood-opacity="0.45" />
    </filter>
    <filter id="slatShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="-6" dy="10" stdDeviation="10" flood-color="#1a0f05" flood-opacity="0.4" />
    </filter>
    <filter id="stylusShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="6" flood-color="#211306" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Palm Leaf Slat 4 (Bottom-most) -->
  <g transform="rotate(32 230 250)" filter="url(#slatShadow)">
    <rect x="70" y="195" width="370" height="96" rx="20" fill="url(#woodGrad1)" stroke="#5c3813" stroke-width="2.5" />
    <line x1="85" y1="220" x2="425" y2="220" stroke="#754719" stroke-width="1" stroke-opacity="0.4" />
    <line x1="85" y1="243" x2="425" y2="243" stroke="#754719" stroke-width="1" stroke-opacity="0.4" />
    <line x1="85" y1="266" x2="425" y2="266" stroke="#754719" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- Palm Leaf Slat 3 -->
  <g transform="rotate(22 230 250)" filter="url(#slatShadow)">
    <rect x="65" y="190" width="375" height="98" rx="20" fill="url(#woodGrad2)" stroke="#633d15" stroke-width="2.5" />
    <!-- Fine palm ribs -->
    <line x1="80" y1="215" x2="425" y2="215" stroke="#7a4b1d" stroke-width="1" stroke-opacity="0.4" />
    <line x1="80" y1="239" x2="425" y2="239" stroke="#7a4b1d" stroke-width="1" stroke-opacity="0.4" />
    <line x1="80" y1="263" x2="425" y2="263" stroke="#7a4b1d" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- Palm Leaf Slat 2 -->
  <g transform="rotate(11 230 250)" filter="url(#slatShadow)">
    <rect x="60" y="185" width="380" height="102" rx="20" fill="url(#woodGrad1)" stroke="#6b4218" stroke-width="2.5" />
    <line x1="75" y1="210" x2="425" y2="210" stroke="#875320" stroke-width="1" stroke-opacity="0.4" />
    <line x1="75" y1="236" x2="425" y2="236" stroke="#875320" stroke-width="1" stroke-opacity="0.4" />
    <line x1="75" y1="262" x2="425" y2="262" stroke="#875320" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- Palm Leaf Slat 1 (Top Primary Chuvadi Leaf) -->
  <g transform="rotate(-2 230 250)" filter="url(#slatShadow)">
    <rect x="52" y="178" width="395" height="110" rx="22" fill="url(#woodGrad3)" stroke="#784a1b" stroke-width="3" />
    
    <!-- Binding Cord Hole with Metal Grommet -->
    <circle cx="100" cy="233" r="14" fill="#3a1e0b" stroke="#784a1b" stroke-width="4" />
    <circle cx="100" cy="233" r="9" fill="#180c04" />
    
    <!-- Margin divider lines -->
    <line x1="140" y1="184" x2="140" y2="282" stroke="#663b12" stroke-width="2.5" />
    
    <!-- Ruling lines for ancient script -->
    <line x1="148" y1="202" x2="330" y2="202" stroke="#78491c" stroke-width="1.5" stroke-opacity="0.75" />
    <line x1="148" y1="223" x2="330" y2="223" stroke="#78491c" stroke-width="1.5" stroke-opacity="0.75" />
    <line x1="148" y1="244" x2="330" y2="244" stroke="#78491c" stroke-width="1.5" stroke-opacity="0.75" />
    <line x1="148" y1="265" x2="330" y2="265" stroke="#78491c" stroke-width="1.5" stroke-opacity="0.75" />
    
    <!-- Ancient Ledger Column Grid on Right -->
    <line x1="335" y1="184" x2="335" y2="282" stroke="#663b12" stroke-width="2.5" />
    <line x1="375" y1="184" x2="375" y2="282" stroke="#663b12" stroke-width="1.5" stroke-opacity="0.8" />
    <line x1="335" y1="208" x2="435" y2="208" stroke="#78491c" stroke-width="1.5" stroke-opacity="0.7" />
    <line x1="335" y1="233" x2="435" y2="233" stroke="#78491c" stroke-width="1.5" stroke-opacity="0.7" />
    <line x1="335" y1="258" x2="435" y2="258" stroke="#78491c" stroke-width="1.5" stroke-opacity="0.7" />
    
    <!-- Ancient Numeral Tallies in Ledger Grid -->
    <text x="355" y="202" font-family="serif" font-size="14" font-weight="bold" fill="#4d2c0e" text-anchor="middle">௱</text>
    <text x="355" y="227" font-family="serif" font-size="14" font-weight="bold" fill="#4d2c0e" text-anchor="middle">௲</text>
    <text x="355" y="252" font-family="serif" font-size="14" font-weight="bold" fill="#4d2c0e" text-anchor="middle">௩</text>
    <text x="355" y="277" font-family="serif" font-size="14" font-weight="bold" fill="#4d2c0e" text-anchor="middle">௪</text>
    
    <text x="405" y="202" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4d2c0e" text-anchor="middle">|||</text>
    <text x="405" y="227" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4d2c0e" text-anchor="middle">||||</text>
    <text x="405" y="252" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4d2c0e" text-anchor="middle">|||</text>
    <text x="405" y="277" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4d2c0e" text-anchor="middle">|||</text>

    <!-- Engraved Tamil Script 'சு' (Chu for Chuvadi) -->
    <path d="M 190 220 
             C 178 208, 160 215, 160 232 
             C 160 248, 175 258, 195 258 
             C 215 258, 228 245, 228 230 
             C 228 212, 210 205, 198 215 
             C 188 223, 185 240, 195 248
             C 202 254, 218 252, 228 244
             L 245 244
             C 260 244, 275 238, 285 230" 
          fill="none" 
          stroke="#3d220a" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Hanging Braided Cord & Carved Wooden Bead -->
  <g>
    <!-- Braided Cord loop -->
    <path d="M 94 236 
             C 80 270, 58 310, 62 360 
             C 65 390, 85 410, 82 430" 
          fill="none" 
          stroke="url(#cordGrad)" 
          stroke-width="10" 
          stroke-linecap="round" />
    <path d="M 94 236 
             C 80 270, 58 310, 62 360 
             C 65 390, 85 410, 82 430" 
          fill="none" 
          stroke="#271810" 
          stroke-width="2.5" 
          stroke-dasharray="3,5" />
          
    <!-- Carved Wooden End Bead / Tassel Knob -->
    <circle cx="82" cy="438" r="16" fill="url(#woodGrad1)" stroke="#3e2723" stroke-width="3" />
    <!-- Bead carving ribs -->
    <ellipse cx="82" cy="438" rx="10" ry="16" fill="none" stroke="#271810" stroke-width="1.5" stroke-opacity="0.6" />
    <ellipse cx="82" cy="438" rx="4" ry="16" fill="none" stroke="#271810" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Tie Knot above bead -->
    <ellipse cx="81" cy="418" rx="8" ry="6" fill="#3e2723" stroke="#271810" stroke-width="2" />
  </g>

  <!-- Antique Bronze Stylus (Ezhuthani) resting diagonally -->
  <g filter="url(#stylusShadow)">
    <!-- Main Stylus Shaft -->
    <polygon points="252,246 258,242 430,76 422,70" fill="url(#stylusGrad)" stroke="#2b200b" stroke-width="1.5" />
    
    <!-- Sharp Writing Nib pointing right at the script stroke -->
    <polygon points="238,256 253,243 257,247" fill="url(#nibGrad)" stroke="#1f1606" stroke-width="1.2" />
    
    <!-- Stylus Ribbed Grips and Engraved Bands -->
    <rect x="310" y="160" width="14" height="26" rx="4" transform="rotate(-44 317 173)" fill="url(#nibGrad)" stroke="#3d2d10" stroke-width="1.5" />
    <rect x="340" y="132" width="16" height="28" rx="5" transform="rotate(-44 348 146)" fill="url(#stylusGrad)" stroke="#3d2d10" stroke-width="1.5" />
    <rect x="380" y="96" width="18" height="30" rx="5" transform="rotate(-44 389 111)" fill="url(#nibGrad)" stroke="#3d2d10" stroke-width="1.5" />

    <!-- Ornate Finial Knob at Top -->
    <circle cx="438" cy="62" r="14" fill="url(#nibGrad)" stroke="#2b200b" stroke-width="2.5" />
    <ellipse cx="438" cy="62" rx="9" ry="14" fill="none" stroke="#523d14" stroke-width="1.5" />
    <circle cx="448" cy="52" r="7" fill="url(#stylusGrad)" stroke="#2b200b" stroke-width="2" />
  </g>

  <!-- Vibrant Green Leaf with Gold Border (Bottom Right) -->
  <g filter="url(#leafShadow)">
    <!-- Golden leaf edge / border -->
    <path d="M 250 478 
             C 285 460, 310 405, 345 340 
             C 385 268, 440 252, 492 258 
             C 502 330, 482 420, 415 470 
             C 365 508, 305 498, 250 478 Z" 
          fill="url(#goldEdge)" 
          stroke="#713f12" 
          stroke-width="2" />
          
    <!-- Lush Green Leaf Body -->
    <path d="M 256 474 
             C 290 456, 313 403, 348 343 
             C 385 275, 436 260, 486 264 
             C 494 328, 476 414, 412 462 
             C 365 498, 308 490, 256 474 Z" 
          fill="url(#leafGrad)" />
          
    <!-- Main Center Golden Vein -->
    <path d="M 256 474 
             C 310 440, 370 375, 486 264" 
          fill="none" 
          stroke="url(#goldEdge)" 
          stroke-width="4.5" 
          stroke-linecap="round" />
          
    <!-- Lateral Golden Veins -->
    <path d="M 315 425 C 335 410, 375 420, 420 448" fill="none" stroke="url(#goldEdge)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 345 390 C 375 380, 420 395, 455 418" fill="none" stroke="url(#goldEdge)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 378 350 C 410 340, 450 350, 476 368" fill="none" stroke="url(#goldEdge)" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 415 310 C 440 300, 465 305, 482 320" fill="none" stroke="url(#goldEdge)" stroke-width="2" stroke-linecap="round" />

    <path d="M 320 422 C 305 400, 290 380, 312 360" fill="none" stroke="url(#goldEdge)" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 355 380 C 340 350, 330 330, 350 310" fill="none" stroke="url(#goldEdge)" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 390 338 C 380 315, 375 295, 400 278" fill="none" stroke="url(#goldEdge)" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
